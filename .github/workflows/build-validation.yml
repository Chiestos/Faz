name: Build Validation

# Release-shaped build validation: release builds (Apple Silicon)
# and app bundle assembly. These take ~25 minutes combined and almost never
# break from routine Rust changes, so they do not gate every push. They run:
#   - on pushes that touch the build pipeline itself (scripts, dependency
#     graph, bundle assets),
#   - once a day as a backstop,
#   - on demand (scripts/release.sh preflight checks the latest run is green
#     before starting a release; dispatch manually if it is stale).
on:
  push:
    branches:
      - main
    paths:
      - 'scripts/build.sh'
      - 'scripts/download_vendor.sh'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'assets/macos/**'
      - '.github/workflows/build-validation.yml'
  schedule:
    # Daily backstop at 18:30 UTC (02:30 Beijing), outside working hours.
    - cron: '30 18 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-build:
    name: Release Build Validation
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Rust
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with:
          toolchain: 1.95.0
          targets: aarch64-apple-darwin

      - name: Cache Cargo
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Build release target
        run: |
          set -o pipefail
          cargo build --locked --release --target aarch64-apple-darwin -p faz-cli -p faz-gui 2>&1 | sed '/has no symbols/d'

      - name: Verify architecture
        run: |
          for bin in faz faz-gui; do
            lipo target/aarch64-apple-darwin/release/$bin -verify_arch arm64
            lipo -info target/aarch64-apple-darwin/release/$bin
          done

  app-bundle:
    name: App Bundle Validation
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Rust
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with:
          toolchain: 1.95.0

      - name: Cache Cargo
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Build debug app bundle
        run: |
          set -o pipefail
          ./scripts/build.sh --native-arch --app-only 2>&1 | sed '/has no symbols/d'

      - name: Verify bundled shell plugins are pinned
        run: |
          test -d dist/Faz.app
          test "$(cat dist/Faz.app/Contents/Resources/vendor/zsh-autosuggestions/.faz-vendor-ref)" = "85919cd1ffa7d2d5412f6d3fe437ebdbeeec4fc5"
          test "$(cat dist/Faz.app/Contents/Resources/vendor/fast-syntax-highlighting/.faz-vendor-ref)" = "3d574ccf48804b10dca52625df13da5edae7f553"
          test "$(cat dist/Faz.app/Contents/Resources/vendor/zsh-completions/.faz-vendor-ref)" = "84615f3d0b0e943d5b1de862c9552e572c8e70bb"
